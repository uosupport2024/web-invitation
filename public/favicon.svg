<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#E5C7A5"/>
  <!-- Wagasa umbrella icon -->
  <g transform="translate(16,16)">
    <!-- Canopy segments -->
    <path d="M0,-12 Q6,-8 8,0" fill="#C27A4A" opacity="0.9"/>
    <path d="M8,0 Q6,6 0,8" fill="#D4925E" opacity="0.9"/>
    <path d="M0,8 Q-6,6 -8,0" fill="#C27A4A" opacity="0.9"/>
    <path d="M-8,0 Q-6,-8 0,-12" fill="#D4925E" opacity="0.9"/>
    <path d="M0,-12 Q-4,-9 -8,0" fill="#B86B3A" opacity="0.85"/>
    <path d="M0,-12 Q4,-9 8,0" fill="#E8A87A" opacity="0.85"/>
    <!-- Spokes -->
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#8B5E3C" stroke-width="0.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="8" y2="0" stroke="#8B5E3C" stroke-width="0.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#8B5E3C" stroke-width="0.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="-8" y2="0" stroke="#8B5E3C" stroke-width="0.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="5.6" y2="-8.5" stroke="#8B5E3C" stroke-width="0.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="5.6" y2="5.6" stroke="#8B5E3C" stroke-width="0.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="-5.6" y2="5.6" stroke="#8B5E3C" stroke-width="0.5" opacity="0.7"/>
    <line x1="0" y1="0" x2="-5.6" y2="-8.5" stroke="#8B5E3C" stroke-width="0.5" opacity="0.7"/>
    <!-- Center cap -->
    <circle cx="0" cy="0" r="1.5" fill="#8B5E3C"/>
    <!-- Handle -->
    <line x1="0" y1="0" x2="0" y2="11" stroke="#8B5E3C" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="11" r="1" fill="#8B5E3C"/>
